version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ig_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPass@2025}
      POSTGRES_DB: instagram_intel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iguser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ig_network

  redis:
    image: redis:7-alpine
    container_name: ig_intel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ig_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ig_intel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-iguser}:${POSTGRES_PASSWORD:-StrongPass@2025}@postgres:5432/instagram_intel
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-min-32-chars-now}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-refresh-secret-min-32-chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      EXPORT_DIR: /app/exports
      LOG_LEVEL: info
      BCRYPT_ROUNDS: 12
    volumes:
      - exports_data:/app/exports
      - logs_data:/app/logs
    ports:
      - "5000:5000"
    networks:
      - ig_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ig_intel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - ig_network

  nginx:
    image: nginx:1.25-alpine
    container_name: ig_intel_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ig_network

volumes:
  postgres_data:
  redis_data:
  exports_data:
  logs_data:

networks:
  ig_network:
    driver: bridge
