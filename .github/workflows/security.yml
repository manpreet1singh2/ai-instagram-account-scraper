name: Security Scan
on:
  schedule: [{ cron: '0 0 * * 1' }]
  push: { branches: [main] }

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: cd backend && npm audit --audit-level=high
      - run: cd frontend && npm audit --audit-level=high
