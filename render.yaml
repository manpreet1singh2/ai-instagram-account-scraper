services:
  # ── Backend API ────────────────────────────────────────────
  - type: web
    name: ig-intel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: ig-intel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ig-intel-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: ig-intel-frontend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend ───────────────────────────────────────────────
  - type: web
    name: ig-intel-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ig-intel-backend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

# ── Database ───────────────────────────────────────────────────
databases:
  - name: ig-intel-db
    plan: free
    databaseName: instagram_intel
    user: iguser

# ── Redis ──────────────────────────────────────────────────────
  - type: redis
    name: ig-intel-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
